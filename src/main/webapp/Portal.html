<!doctype html>
<html id="synapse.org" dir="ltr" lang="en-US">
  <head>
    <title>${pageTitle}</title>
    <meta name="description" content="${pageDescription}" />
    <meta property="og:title" content="${pageTitle}" />
    <meta property="og:description" content="${ogPageDescription}" />
    <meta name="author" content="Sage Bionetworks, info@sagebase.org" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval' *.synapse.org *.sagebase.org *.googleapis.com *.gstatic.com *.googletagmanager.com cdn.statuspage.io s3.amazonaws.com www.google-analytics.com kh896k90gyvg.statuspage.io *.youtube.com *.rstudio.com *.google.com *.shinyapps.io *.smartsheet.com sagebionetworks.jira.com 127.0.0.1:9876 localhost:5173; frame-ancestors 'self' https://*.synapse.org localhost; img-src * data: blob:; connect-src https://* http://127.0.0.1:8888 http://localhost:5173 ws://localhost:5173 wss://*.execute-api.us-east-1.amazonaws.com"
    />
    <meta
      name="google-site-verification"
      content="KIO5H8Bg3i0oAEAzTEMK5qIlYJLbd2zogLs_-im4rI0"
    />
    <meta name="msvalidate.01" content="E37AC1589F823723B64275D4BC890B1A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      property="og:logo"
      content="https://www.synapse.org/images/synapselogo.png"
    />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="${ogUrl}" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://www.synapse.org/images/ogimage.png"
    />

    <!-- Twitter Meta Tags -->
    <meta
      property="twitter:image"
      content="https://www.synapse.org/images/ogimage.png"
    />
    <meta name="twitter:title" content="${ogPageTitle}" />
    <meta name="twitter:description" content="${ogPageDescription}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Sagebio" />
    <meta name="twitter:creator" content="@Sagebio" />

    ${botHeadHtml}

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 10]>
      <div class="alert alert-warning" role="alert">
        <a
          class="alert-link"
          href="http://windows.microsoft.com/en-us/internet-explorer/download-ie"
          target="_blank"
        >
          You are using an outdated browser. For a faster, safer browsing
          experience, click here to upgrade today.</a
        >
      </div>
    <![endif]-->
    <!--[if lt IE 9]>
      <script src="bootstrap-3.0/assets/js/html5shiv.js"></script>
      <script src="bootstrap-3.0/assets/js/respond.min.js"></script>
    <![endif]-->

    <!-- SWC-6609 removed <script src="js/json-ld-element-loader.js"></script> -->
    <meta http-equiv="x-dns-prefetch-control" content="off" />

    <!-- meta to instruct browser not to cache portal.html -->
    <!-- http://stackoverflow.com/questions/1341089/using-meta-tags-to-turn-off-caching-in-all-browsers -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <!-- end cache control -->
    <link rel="icon" href="/favicon.png?v=4" />
    <link
      href="/opensearch.xml"
      rel="search"
      title="Synapse"
      type="application/opensearchdescription+xml"
    />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Modern browsers natively support this function.
      if (typeof Object.assign !== 'function') {
        document.write(
          '<div class="alert alert-danger" role="alert" style="margin:0px">Unsupported browser: A modern browser is required for security, reliability, and performance.</div>',
        )
      }
    </script>
    <script>
      // SWC-5959: Before loading the SRC library, set value so actual column names are shown in Synapse.org
      window.localStorage.setItem('force-display-original-column-names', 'true')
    </script>
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/loadinglogo.css"
      type="text/css"
    />
    <script src="${cdnEndpoint}/js/compiled-closure-lib.js"></script>
    <script src="${cdnEndpoint}/Portal/Portal.nocache.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      type="text/css"
    />
    <script src="${cdnEndpoint}/generated/jquery.min.js"></script>
    <script src="${cdnEndpoint}/generated/jquery-ui.min.js"></script>

    ${viteImports}

    <!--
    Load latest version of Bootstrap 3 to override the version bundled by GWTBootstrap3
    The Bootstrap 3 custom theme CSS is loaded through swc.scss
    -->
    <script src="${cdnEndpoint}/generated/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="${cdnEndpoint}/js/back-forward-nav-handler.js"></script>
    <script src="${cdnEndpoint}/generated/moment.min.js"></script>
    <script src="${cdnEndpoint}/generated/jsplumb.min.js"></script>
    <script src="${cdnEndpoint}/js/jquery.tablesorter.min.js"></script>
    <script src="${cdnEndpoint}/js/jquery.tablesorter.scinot.js"></script>
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/icons/font/synapseicons.css?v=1"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/generated/font-awesome.css"
      type="text/css"
    />
    <script src="${cdnEndpoint}/js/highlight.pack.js"></script>
    <script src="${cdnEndpoint}/js/init-nchart.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-br.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-center-text.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-container.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-emphasis-alt.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-inline-comments.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-math.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-strikethrough-alt.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-sub.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-sup.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-synapse.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-synapse-heading.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-synapse-math.js"></script>
    <script src="${cdnEndpoint}/generated/markdown-it-synapse-table.js"></script>
    <script src="${cdnEndpoint}/generated/katex/katex.min.js"></script>
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/generated/katex/katex.min.css"
      type="text/css"
    />
    <script src="${cdnEndpoint}/js/polyfill-2.js"></script>
    <script src="${cdnEndpoint}/generated/xss.min.js"></script>
    <script src="${cdnEndpoint}/generated/pica.min.js"></script>
    <script src="${cdnEndpoint}/generated/prop-types.min.js"></script>
    <script src="${cdnEndpoint}/generated/plotly.min.js"></script>
    <script src="${cdnEndpoint}/generated/create-plotly-component.min.js"></script>
    <script src="${cdnEndpoint}/generated/universalCookie.min.js"></script>
    <!-- We don't load SRC's scss because we include it in our own compiled scss -->
    <script src="${cdnEndpoint}/generated/croppie.min.js"></script>
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/generated/croppie.css"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/css/highlight-js-default.css"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="${cdnEndpoint}/generated/jquery-ui.min.css"
      type="text/css"
    />
    <script src="${cdnEndpoint}/js/linkify.min.js"></script>
    <script src="${cdnEndpoint}/js/linkify-string.min.js"></script>
    <script src="//cdn.statuspage.io/se-v2.js"></script>
    <!-- script src="//kh896k90gyvg.statuspage.io/embed/script.js"></script -->
    <script src="${cdnEndpoint}/generated/papaparse.min.js"></script>
  </head>
  <body id="body">
    ${botBodyHtml}
    <div>
      <!-- GWT history support -->
      <iframe
        src="javascript:''"
        id="__gwt_historyFrame"
        tabindex="-1"
        style="position: absolute; width: 0; height: 0; border: 0"
      ></iframe>
      <div id="dropzone" class="dropzone" style="display: none">
        <h2 class="center" style="color: white; padding-top: 180px">
          <span class="fa fa-cloud-upload"></span>
          Drop files to upload
        </h2>
      </div>
      <noscript>
        <div
          style="
            width: 22em;
            position: absolute;
            left: 50%;
            margin-left: -11em;
            color: red;
            background-color: white;
            border: 1px solid red;
            padding: 4px;
            font-family: sans-serif;
          "
        >
          Your web browser must have JavaScript enabled in order for this
          application to display correctly.<br />
          If you are an automated web crawler from a search engine, follow this
          <a href="https://synapse.prod.sagebase.org/Home:0"
            >AJAX application crawl link</a
          >
        </div>
      </noscript>
      <!-- Google Tag Manager (noscript) -->
      <noscript>
        <iframe
          src="https://www.googletagmanager.com/ns.html?id=GTM-KPW4KS62"
          height="0"
          width="0"
          style="display: none; visibility: hidden"
        ></iframe>
      </noscript>
      <!-- End Google Tag Manager (noscript) -->
      <!-- This is the GWT-generated body -->
      <div id="alertWrapper">
        <div id="alertContainer"></div>
      </div>
      <div id="initialLoadingUI" style="padding-top: 180px">
        <div
          class="spinner"
          style="
            width: 80px;
            height: 80px;
            background-size: 80px 80px;
            display: block;
            margin: auto;
          "
        ></div>
        <h4
          style="
            color: #1e7098;
            margin-top: 10px;
            font-family: Sans-serif;
            text-align: center;
          "
        >
          ${loadingObjectDescriptor}&hellip;
        </h4>
      </div>
      <div id="headerPanel" class="zeroOpacity"></div>
      <div id="rootPanel" class="zeroOpacity"></div>
      <div id="toastContainer"></div>
      <div id="footerPanel"></div>
    </div>
    <div class="clear"></div>
  </body>
</html>
